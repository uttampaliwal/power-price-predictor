[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-price-predictor"
version = "1.0.0"
description = "ML-based forecasting of Indian electricity prices (IEX DAM) at 15-minute granularity"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Uttam Paliwal", email = "uttam@example.com"}
]
keywords = ["electricity", "price-forecasting", "machine-learning", "energy", "time-series"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "pyarrow>=12.0.0",
    "urllib3>=2.0.0",
    "holidays>=0.30",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
    "tqdm>=4.65.0",
    "lxml>=4.9.0",
    "html5lib>=1.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "mlflow>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
deep-learning = [
    "torch>=2.0.0",
]
statistical = [
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/uttampaliwal/power-price-predictor"
Repository = "https://github.com/uttampaliwal/power-price-predictor"
Issues = "https://github.com/uttampaliwal/power-price-predictor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["src*"]
